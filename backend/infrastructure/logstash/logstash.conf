input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["sentinel.events.raw", "sentinel.events.processed", "sentinel.alerts", "sentinel.incidents"]
    codec => "json"
    group_id => "logstash-consumer"
    auto_offset_reset => "latest"
  }
}

filter {
  # Add a timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Tag based on topic/event type
  if [event_type] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "sentineliq-%{event_type}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "sentineliq-events" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
  }

  # Also log to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
