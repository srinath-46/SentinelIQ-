input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    topics => ["security-events", "endpoint-events", "network-events", "data-events"]
    group_id => "sentineliq-logstash-consumer"
    codec => json
    auto_offset_reset => "earliest"
    decorate_events => true
  }
}

filter {
  # We assume events have already been normalized into SecurityEventIngest 
  # or SecurityEventRead format by Python before hitting Kafka.
  
  # Basic data hygiene
  mutate {
    remove_field => ["@version", "kafka"]
  }

  # Ensure timestamp is mapped correctly for Elasticsearch
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Basic GeoIP enrichment for external IPs (Lightweight enrichment only; 
  # complex ML stays in Python).
  if [source_ip] {
    geoip {
      source => "source_ip"
      target => "source_geo"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }
  
  if [destination_ip] {
    geoip {
      source => "destination_ip"
      target => "destination_geo"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    # Index naming strategy: sentineliq-events-<organization_id>-YYYY.MM.dd
    # We use organization_id for logical tenant partitioning in ES.
    index => "sentineliq-events-%{[organization_id]}-%{+YYYY.MM.dd}"
    
    # Elasticsearch credentials (passed via environment variables in Docker)
    user => "${ELASTICSEARCH_USERNAME:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
    
    # Retry and resilience
    retry_on_conflict => 3
    action => "create"
  }
  
  # Fail-safe stdout for debugging in development environments
  if "${ENVIRONMENT:development}" == "development" {
    stdout { codec => rubydebug }
  }
}
